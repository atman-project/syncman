[package]
name = "syncman-network"
version = "0.1.0"
authors = ["Youngjoon Lee"]
edition = "2021"
description = "Conflict-free Synchronization Library - Network Modules"
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"

[dependencies]
anyhow = "1"
